name: CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libwayland-bin libxkbcommon-dev libatspi2.0-dev libglib2.0-dev pkg-config libc6-dev python3 binutils curl xz-utils
      - name: Zig 0.16.0 (pinned x86_64 checksum)
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz --output zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz' | sha256sum --check
          zig_install=$(mktemp -d "$RUNNER_TEMP/zig-0.16.0.XXXXXX")
          tar -xf zig.tar.xz --strip-components=1 -C "$zig_install"
          echo "$zig_install" >> "$GITHUB_PATH"
      - name: Check toolchain pin
        run: test "$(zig version)" = "$(tr -d '\n' < .zigversion)"
      - run: zig build test
      - name: Keyboard unit tests (no Wayland connection)
        run: python3 tests/keyboard_unit.py
      - name: Formatting and all offline regressions (private fixtures, no desktop)
        run: zig build check -Doptimize=ReleaseSafe -Dcpu=baseline
      - name: Optional GTK4 preview build and ABI check
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y libgtk-4-dev
          zig build pip -Doptimize=ReleaseSafe -Dcpu=baseline
      - run: python3 -m py_compile tests/*.py tests/fixtures/*.py scripts/*.py examples/blender/style_room.py
      - run: bash -n completions/deskctl.bash
