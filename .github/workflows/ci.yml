name: CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libatspi2.0-dev libglib2.0-dev pkg-config
      - name: Zig 0.16.0
        run: |
          curl --fail --location https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz --output zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz' | sha256sum --check
          tar -xf zig.tar.xz
          echo "$GITHUB_WORKSPACE/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - run: zig fmt --check build.zig src
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSafe
      - run: python3 tests/integration.py
      - run: python3 -m py_compile tests/*.py
      - run: bash -n completions/deskctl.bash
